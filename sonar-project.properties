# Análise de qualidade do AgroSmart no SonarQube (usado pelo pipeline e pelo Jenkinsfile).
sonar.projectKey=agrosmart
sonar.projectName=AgroSmart
sonar.projectVersion=sprint7
sonar.sourceEncoding=UTF-8

# Código de produção: app web (Next.js), worker, API de visão (FastAPI) e simulador.
sonar.sources=web/src,web/scripts,api/app,simulator
# Fora: componentes de UI gerados pelo shadcn, testes e dependências.
sonar.exclusions=**/node_modules/**,web/src/components/ui/**,**/*.test.ts,simulator/test_*.py

# Testes, contados à parte.
sonar.tests=web/src,simulator
sonar.test.inclusions=**/*.test.ts,simulator/test_*.py

sonar.python.version=3.12
sonar.scm.disabled=true
