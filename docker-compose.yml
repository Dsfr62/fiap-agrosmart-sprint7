services:
  web:
    image: agrosmart-web:${AGROSMART_TAG:-local}
    build:
      context: ./web
    environment:
      - DB_PATH=/data/agrosmart.db
      - UPLOADS_DIR=/data/uploads
      - API_BASE_URL=http://api:8000
      - MQTT_URL=mqtt://mosquitto:1883
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - UPLOAD_AUDIT_SALT=${UPLOAD_AUDIT_SALT}
      - AGROSMART_PUBLIC_ORIGIN=${AGROSMART_PUBLIC_ORIGIN}
    volumes:
      - data:/data
    networks: [internal, public_net]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s

  api:
    image: agrosmart-api:${AGROSMART_TAG:-local}
    build:
      context: ./api
    environment:
      - UPLOADS_DIR=/data/uploads
      - AGROSMART_OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks: [internal, public_net]
    volumes:
      - data:/data
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public_net]
    environment:
      - AGROSMART_DOMAIN=${AGROSMART_DOMAIN}
    depends_on: [web]

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # Monitoramento: o broker só conta como saudável se responder a uma assinatura.
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "5"]
      interval: 15s
      timeout: 8s
      retries: 3
    networks: [internal]
    stop_grace_period: 10s

networks:
  internal:
    internal: true
  public_net: {}

volumes:
  data:
  caddy_data:
  caddy_config:
